[tool.poetry]
name = "unreal-build"
version = "0.1.0"
description = "Simple Unreal Engine projects build tool"
authors = []
readme = "README.md"
packages = [{include = "unreal_build"}]

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = {version = "^6.0.2", optional = true}
p4python = {version = "^2024.2.2682690", optional = true}

[tool.poetry.scripts]
unreal-build = 'unreal_build.__main__:main'

[tool.poetry.extras]
yaml = ["pyyaml"]
perforce = ["p4python"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
